<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CloudGate | Self-Service AWS Provisioning</title>
<style>
:root{font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;color:#162b43;background:#f3f6fb}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button{cursor:pointer}header{background:#10263f;color:white;padding:16px 30px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}header strong{font-size:20px}header small{color:#c5d3e5}.badge{background:#174862;color:#d4f8fc;padding:6px 10px;border-radius:20px;font-size:12px}.layout{display:grid;grid-template-columns:220px 1fr;min-height:calc(100vh - 72px)}nav{background:white;padding:24px 12px;border-right:1px solid #dde5ee}nav button{display:block;width:100%;border:0;text-align:left;padding:12px 16px;background:transparent;border-radius:9px;color:#3b5067;margin:4px 0}nav button.active{background:#e7f0fd;color:#1556a5;font-weight:700}main{max-width:1300px;width:100%;margin:auto;padding:28px}h1{margin:0 0 6px;font-size:27px}p{color:#60758c;margin-top:6px}.cards{display:grid;grid-template-columns:repeat(4,minmax(120px,1fr));gap:14px;margin:24px 0}.card,.panel{background:white;border:1px solid #e0e7ef;border-radius:14px;padding:18px;box-shadow:0 3px 12px #263d5708}.card span{color:#6c7e91;font-size:12px}.card strong{display:block;font-size:27px;margin-top:8px}.panel{margin:18px 0}table{width:100%;border-collapse:collapse;font-size:13px}th,td{text-align:left;padding:13px 10px;border-bottom:1px solid #e8edf3}th{color:#6c7e91;font-size:12px}tr:last-child td{border:0}button.primary{border:0;background:#1764c0;color:white;border-radius:8px;padding:10px 14px}button.secondary{border:1px solid #c6d4e1;background:white;color:#264863;border-radius:8px;padding:9px 13px}.flex{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}.status{font-size:11px;font-weight:700;border-radius:20px;background:#e8f1fc;color:#1358a3;padding:6px 9px;display:inline-block}.status.VERIFIED,.status.DEPLOYED_DEMO{background:#def8eb;color:#08774b}.status.REJECTED,.status.CANCELLED{background:#fce7e7;color:#b51f27}.step{display:flex;align-items:flex-start;gap:12px;padding:10px 4px;border-bottom:1px solid #eef1f5}.step:last-child{border:0}.circle{width:27px;height:27px;border-radius:50%;background:#e2e9f4;color:#46566c;text-align:center;line-height:27px;font-size:12px;flex-shrink:0}.step.done .circle{background:#d7f5e7;color:#08774b}.step.current .circle{background:#1764c0;color:white}.step strong{font-size:13px}.muted{color:#708397;font-size:12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}label{display:block;color:#425770;font-size:13px;font-weight:600;margin:12px 0 5px}input,select,textarea{width:100%;border:1px solid #cbd7e5;border-radius:8px;padding:10px;background:white;color:#18314c}textarea{min-height:84px}input[type=checkbox]{width:auto;margin-right:8px}select.role{width:205px;background:#173b5c;border:1px solid #4b7195;color:white}#alert{padding:12px;border-radius:8px;margin:14px 0;display:none}#alert.show{display:block;background:#e2f3ff;color:#124970}#alert.error{background:#fee8e8;color:#ad1f26}#page{min-width:0}.clickable{cursor:pointer}.clickable:hover{background:#f5f9ff}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#10263f;color:#d9e8f8;border-radius:10px;padding:15px;font-size:12px}.pill{background:#f5e8c9;color:#72550f;padding:5px 9px;border-radius:20px;font-size:12px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin:15px 0}@media(max-width:850px){.layout{display:block}nav{display:flex;overflow:auto;padding:6px}nav button{white-space:nowrap}.cards{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}main{padding:15px}table{display:block;overflow:auto}}
</style></head><body><header><div><strong>☁ CloudGate</strong> &nbsp; <span class="badge">AWS Provisioning • DEMO MODE</span><br><small>Intake · Governance · IaC · Policy as Code · CI/CD</small></div><div class="flex"><span style="font-size:12px">Acting role</span><select aria-label="Demo role" class="role" id="role" onchange="loadPage()"><option value="BUSINESS_USER">Business User</option><option value="PRODUCT_OWNER">Product Owner</option><option value="TECH_OWNER">Tech Owner</option><option value="ENGINEER">Engineering</option><option value="RELEASE_MANAGER">Release Approver</option><option value="AUDITOR">Auditor</option><option value="EXECUTIVE">Executive</option></select></div></header><div class="layout"><nav><button id="nav-dashboard" class="active" onclick="show('dashboard')">◫ &nbsp; Executive Overview</button><button id="nav-intake" onclick="show('intake')">＋ &nbsp; New Intake</button><button id="nav-requests" onclick="show('requests')">▤ &nbsp; Request Pipeline</button><button id="nav-audit" onclick="show('audit')">▦ &nbsp; Audit Trail</button><button id="nav-infra" onclick="show('infra')">⌘ &nbsp; IaC & Policy Evidence</button></nav><main><div id="alert"></div><div id="page"></div></main></div>
<script>
const stages=['INTAKE','BUSINESS_APPROVED','TECH_APPROVED','CODE_PUSHED','BUILT_TESTED','SECURITY_PASSED','INFRA_VALIDATED','RELEASE_APPROVED','DEPLOYED_DEMO','VERIFIED'];
const descriptions=['Intake submitted','Business approval','Technical approval','Developer pushes code','Build and test','Security verification','Infrastructure validation','Approval gate','Deploy (simulation)','Verify'];
const owners=['Business User','Product Owner','Tech Owner','Engineering','CI/CD','Security','Terraform + OPA','Release Approver','CI/CD','Engineering / QA'];
let current='dashboard',selected=null,editing=null;
const el=document.getElementById('page');const role=()=>document.getElementById('role').value;
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(path,options={}){const r=await fetch('/api'+path,{...options,headers:{'Content-Type':'application/json','X-Demo-Role':role(),...(options.headers||{})}});if(!r.ok){let o;try{o=await r.json()}catch{}throw Error(o?.error||'HTTP '+r.status)}if(r.status===204)return null;return r.json()}
function alertMsg(msg,error=false){const a=document.getElementById('alert');a.className='show'+(error?' error':'');a.textContent=msg;setTimeout(()=>a.className='',7000)}
function show(tab){current=tab;selected=null;editing=null;loadPage()}
async function loadPage(){for(const b of document.querySelectorAll('nav button'))b.classList.toggle('active',b.id==='nav-'+current);try{if(current==='dashboard')await dashboard();if(current==='intake')intake();if(current==='requests')await requests();if(current==='audit')await audit();if(current==='infra')infra()}catch(e){alertMsg(e.message,true)}}
async function dashboard(){const [d,rs]=await Promise.all([api('/dashboard'),api('/requests')]);el.innerHTML=`<h1>Executive Overview</h1><p>Governed AWS infrastructure requests, approval progress, and compliance evidence. No real AWS resources are created.</p><div class="cards">${[['Total Requests',d.total],['Business Pending',d.pendingBusiness],['Technical Pending',d.pendingTechnical],['Verified Deployments',d.verified]].map(([a,b])=>`<div class="card"><span>${a}</span><strong>${b}</strong></div>`).join('')}</div><div class="panel"><div class="flex"><h3>Recent Cloud Requests</h3><button class="primary" onclick="show('intake')">+ New Request</button></div>${requestTable(rs.slice(0,8))}</div><div class="grid"><div class="panel"><h3>Governance Controls</h3><p>✓ Business and technical approval<br>✓ Build and security verification<br>✓ Terraform infrastructure validation<br>✓ OPA policy-as-code gate<br>✓ Release approval and audit history</p></div><div class="panel"><h3>Deployment Mode</h3><p><strong>Local Demo (No AWS)</strong></p><p>Spring Boot and PostgreSQL are real. Terraform and Rego policy testing run in GitHub Actions. AWS deployment within the portal is a labeled simulation.</p></div></div>`}
function requestTable(rs){return `<table><thead><tr><th>ID</th><th>Request</th><th>Cloud Service</th><th>Environment</th><th>Stage</th><th>Action</th></tr></thead><tbody>${rs.length?rs.map(r=>`<tr><td>#${r.id}</td><td><strong>${esc(r.title)}</strong><div class="muted">${esc(r.businessUnit)}</div></td><td>${esc(r.service)}</td><td>${esc(r.environment)}</td><td><span class="status ${esc(r.status)}">${esc(r.status.replaceAll('_',' '))}</span></td><td><button class="secondary" onclick="openRequest(${r.id})">Open</button></td></tr>`).join(''):'<tr><td colspan="6">No requests yet. Create your first cloud intake.</td></tr>'}</tbody></table>`}
function intake(r=null){editing=r?.id||null;el.innerHTML=`<h1>${r?'Edit':'New'} Cloud Provisioning Intake</h1><p>Step 1 · Business users request AWS services. Role selection is illustrative only, not secure authentication.</p><div class="panel"><form id="intakeform" onsubmit="submitIntake(event)"><div class="grid"><div><label>Project / Request Title</label><input name="title" maxlength="200" required value="${esc(r?.title)}" placeholder="Finance reporting PostgreSQL"></div><div><label>Requester</label><input name="requester" maxlength="200" required value="${esc(r?.requester)}" placeholder="Taylor Smith"></div><div><label>Business Unit</label><input name="businessUnit" maxlength="150" required value="${esc(r?.businessUnit)}" placeholder="Finance Technology"></div><div><label>AWS Service</label><select name="service">${['RDS','S3','ECS','VPC'].map(x=>`<option ${r?.service===x?'selected':''}>${x}</option>`).join('')}</select></div><div><label>Target Environment</label><select name="environment">${['dev','test','prod'].map(x=>`<option ${r?.environment===x?'selected':''}>${x}</option>`).join('')}</select></div><div><label>Governance Controls</label><div><label style="font-weight:400"><input type="checkbox" name="encryptionEnabled" ${r?.encryptionEnabled!==false?'checked':''}>Encryption enabled</label><label style="font-weight:400"><input type="checkbox" name="publicAccess" ${r?.publicAccess?'checked':''}>Public access (policy will reject)</label></div></div></div><label>Business Justification</label><textarea name="justification" placeholder="What is the business value?">${esc(r?.justification)}</textarea><div class="actions"><button class="primary" type="submit">${r?'Save Changes':'Submit Intake'}</button><button type="button" class="secondary" onclick="show('requests')">Cancel</button></div></form></div>`}
async function submitIntake(e){e.preventDefault();const fd=new FormData(e.target);const obj=Object.fromEntries(fd);obj.encryptionEnabled=fd.has('encryptionEnabled');obj.publicAccess=fd.has('publicAccess');try{const id=editing;const result=await api(id?'/requests/'+id:'/requests',{method:id?'PUT':'POST',body:JSON.stringify(obj)});current='requests';await openRequest(result.id);alertMsg('Request saved in PostgreSQL.')}catch(err){alertMsg(err.message,true)}}
async function requests(){const rs=await api('/requests');el.innerHTML=`<div class="flex"><div><h1>Request Pipeline</h1><p>All AWS service intake requests and stage transitions</p></div><button class="primary" onclick="show('intake')">+ New Intake</button></div><div class="panel">${requestTable(rs)}</div>`}
async function openRequest(id){selected=id;current='requests';for(const b of document.querySelectorAll('nav button'))b.classList.toggle('active',b.id==='nav-requests');try{const [r,history]=await Promise.all([api('/requests/'+id),api('/requests/'+id+'/audit')]);const idx=stages.indexOf(r.status);const nextRole=idx===0?'PRODUCT_OWNER':idx===1?'TECH_OWNER':idx===7?'RELEASE_MANAGER':'ENGINEER';el.innerHTML=`<div class="flex"><div><button class="secondary" onclick="show('requests')">← All Requests</button><h1 style="margin-top:14px">#${r.id} · ${esc(r.title)}</h1><p>${esc(r.businessUnit)} · ${esc(r.requester)} · ${esc(r.service)} · ${esc(r.environment)}</p></div><span class="status ${esc(r.status)}">${esc(r.status.replaceAll('_',' '))}</span></div><div class="grid"><div><div class="panel"><h3>Request Details</h3><p>${esc(r.justification||'No justification entered.')}</p><p>Encryption: <b>${r.encryptionEnabled?'Enabled':'Disabled'}</b><br>Public Access: <b>${r.publicAccess?'Enabled':'Disabled'}</b></p><div class="actions">${['INTAKE','CHANGES_REQUESTED'].includes(r.status)?'<button class="secondary" onclick="editSelected()">Edit intake</button>':''}${r.status==='INTAKE'?'<button class="secondary" onclick="cancelSelected()">Cancel request</button>':''}</div></div><div class="panel"><h3>Stage Actions</h3><p>Required next role: <b>${esc(nextRole)}</b></p><p class="muted">Switch the acting role in the header to demonstrate approval enforcement.</p><div class="actions">${idx>=0&&idx<stages.length-1?'<button class="primary" onclick="transition(&quot;ADVANCE&quot;)">Approve / Complete Stage →</button>':''}${['INTAKE','BUSINESS_APPROVED'].includes(r.status)?'<button class="secondary" onclick="transition(&quot;REQUEST_CHANGES&quot;)">Request Changes</button><button class="secondary" onclick="transition(&quot;REJECT&quot;)">Reject</button>':''}</div>${r.status==='DEPLOYED_DEMO'?'<p><span class="pill">Simulated AWS deployment — no AWS cloud resource created.</span></p>':''}</div></div><div><div class="panel"><h3>Workflow Progress</h3>${stages.map((s,i)=>`<div class="step ${idx>i?'done':idx===i?'current':''}"><div class="circle">${idx>i?'✓':i+1}</div><div><strong>${esc(descriptions[i])}</strong><div class="muted">${esc(owners[i])}</div></div></div>`).join('')}</div></div></div><div class="panel"><h3>Immutable-style Audit History (Demo)</h3>${auditTable(history)}</div>`}catch(e){alertMsg(e.message,true)}}
async function editSelected(){try{intake(await api('/requests/'+selected))}catch(e){alertMsg(e.message,true)}}
async function cancelSelected(){if(!confirm('Cancel this intake? Its audit record will be retained.'))return;try{await api('/requests/'+selected,{method:'DELETE'});await openRequest(selected);alertMsg('Request cancelled (soft delete).')}catch(e){alertMsg(e.message,true)}}
async function transition(action){const comment=prompt('Approval / execution note (optional):','Demo stage action');if(comment===null)return;try{await api('/requests/'+selected+'/advance',{method:'POST',body:JSON.stringify({action,comment})});await openRequest(selected);alertMsg('Stage updated; audit event recorded.')}catch(e){alertMsg(e.message,true)}}
function auditTable(history){return `<table><thead><tr><th>Date</th><th>Role</th><th>Action</th><th>From → To</th><th>Detail</th></tr></thead><tbody>${history.length?history.map(a=>`<tr><td>${new Date(a.createdAt).toLocaleString()}</td><td>${esc(a.role)}</td><td>${esc(a.action)}</td><td>${esc(a.fromStatus||'—')} → ${esc(a.toStatus)}</td><td>${esc(a.detail)}</td></tr>`).join(''):'<tr><td colspan="5">No events yet</td></tr>'}</tbody></table>`}
async function audit(){const history=await api('/audit');el.innerHTML=`<h1>Audit Trail</h1><p>Every intake, approval, update, simulated deployment, and verification transition is recorded in PostgreSQL. This is a demo log, not tamper-proof compliance storage.</p><div class="panel">${auditTable(history)}</div>`}
function infra(){el.innerHTML=`<h1>Infrastructure as Code + Policy as Code</h1><p>GitHub Actions runs actual Terraform checks and OPA policy tests against a no-cloud Terraform plan.</p><div class="grid"><div class="panel"><h3>Terraform (provider-free)</h3><pre>resource "terraform_data" "mock_aws_provision" {
  input = {
    service            = "RDS"
    environment        = "dev"
    encryption_enabled = true
    public_access      = false
    mode               = "SIMULATED_ONLY_NO_AWS"
  }
}</pre><p>Generates a real Terraform plan with no AWS provider or credentials.</p></div><div class="panel"><h3>OPA / Rego Policy Gates</h3><pre>deny if encryption_enabled == false
deny if public_access == true
deny if environment is invalid</pre><p>GitHub CI checks a secure plan must pass and an intentionally insecure plan must fail.</p></div></div><div class="panel"><h3>Pipeline evidence</h3><p>GitHub Actions workflow: <code>.github/workflows/ci.yml</code></p><p>Build & test → container security scan → Terraform plan → Conftest Rego checks → protected approval → ephemeral Docker deployment → API verification → evidence artifact.</p><p><strong>Important:</strong> The web portal's stage transitions illustrate workflow governance. They do not execute or attest to specific GitHub Actions runs. A production integration should use GitHub webhooks, signed evidence, and run IDs.</p></div>`}
loadPage();
</script></body></html>
