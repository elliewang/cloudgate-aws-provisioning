server:
  port: ${PORT:8080}
spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/portal}
    username: ${DB_USER:portal}
    password: ${DB_PASSWORD:demo-only-password}
  jpa:
    hibernate:
      ddl-auto: update # DEMO ONLY; replace with Flyway migrations in production
    open-in-view: false
  jackson:
    serialization:
      write-dates-as-timestamps: false
management:
  endpoints:
    web:
      exposure:
        include: health
