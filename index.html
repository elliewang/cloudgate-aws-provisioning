<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CloudGate | Self-Service AWS Provisioning</title>
<style>
:root{font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;color:#162b43;background:#f3f6fb}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button{cursor:pointer}header{background:#10263f;color:white;padding:16px 30px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}header strong{font-size:20px}header small{color:#c5d3e5}.badge{background:#174862;color:#d4f8fc;padding:6px 10px;border-radius:20px;font-size:12px}.layout{display:grid;grid-template-columns:220px 1fr;min-height:calc(100vh - 72px)}nav{background:white;padding:24px 12px;border-right:1px solid #dde5ee}nav button{display:block;width:100%;border:0;text-align:left;padding:12px 16px;background:transparent;border-radius:9px;color:#3b5067;margin:4px 0}nav button.active{background:#e7f0fd;color:#1556a5;font-weight:700}main{max-width:1300px;width:100%;margin:auto;padding:28px}h1{margin:0 0 6px;font-size:27px}p{color:#60758c;margin-top:6px}.cards{display:grid;grid-template-columns:repeat(4,minmax(120px,1fr));gap:14px;margin:24px 0}.card,.panel{background:white;border:1px solid #e0e7ef;border-radius:14px;padding:18px;box-shadow:0 3px 12px #263d5708}.card span{color:#6c7e91;font-size:12px}.card strong{display:block;font-size:27px;margin-top:8px}.panel{margin:18px 0}table{width:100%;border-collapse:collapse;font-size:13px}th,td{text-align:left;padding:13px 10px;border-bottom:1px solid #e8edf3}th{color:#6c7e91;font-size:12px}tr:last-child td{border:0}button.primary{border:0;background:#1764c0;color:white;border-radius:8px;padding:10px 14px}button.secondary{border:1px solid #c6d4e1;background:white;color:#264863;border-radius:8px;padding:9px 13px}.flex{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}.status{font-size:11px;font-weight:700;border-radius:20px;background:#e8f1fc;color:#1358a3;padding:6px 9px;display:inline-block}.status.VERIFIED,.status.DEPLOYED_DEMO{background:#def8eb;color:#08774b}.status.REJECTED,.status.CANCELLED{background:#fce7e7;color:#b51f27}.step{display:flex;align-items:flex-start;gap:12px;padding:10px 4px;border-bottom:1px solid #eef1f5}.step:last-child{border:0}.circle{width:27px;height:27px;border-radius:50%;background:#e2e9f4;color:#46566c;text-align:center;line-height:27px;font-size:12px;flex-shrink:0}.step.done .circle{background:#d7f5e7;color:#08774b}.step.current .circle{background:#1764c0;color:white}.step strong{font-size:13px}.muted{color:#708397;font-size:12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}label{display:block;color:#425770;font-size:13px;font-weight:600;margin:12px 0 5px}input,select,textarea{width:100%;border:1px solid #cbd7e5;border-radius:8px;padding:10px;background:white;color:#18314c}textarea{min-height:84px}input[type=checkbox]{width:auto;margin-right:8px}select.role{width:205px;background:#173b5c;border:1px solid #4b7195;color:white}#alert{padding:12px;border-radius:8px;margin:14px 0;display:none}#alert.show{display:block;background:#e2f3ff;color:#124970}#alert.error{background:#fee8e8;color:#ad1f26}#page{min-width:0}.clickable{cursor:pointer}.clickable:hover{background:#f5f9ff}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#10263f;color:#d9e8f8;border-radius:10px;padding:15px;font-size:12px}.pill{background:#f5e8c9;color:#72550f;padding:5px 9px;border-radius:20px;font-size:12px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin:15px 0}@media(max-width:850px){.layout{display:block}nav{display:flex;overflow:auto;padding:6px}nav button{white-space:nowrap}.cards{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}main{padding:15px}table{display:block;overflow:auto}}
.notice{background:#fff7e6;border:1px solid #e9c783;border-radius:9px;padding:13px 16px;color:#775411;font-size:12px;margin-bottom:18px}.danger{border:1px solid #f2c8c8!important;color:#a32424!important}.small{font-size:12px;color:#708397}.code{font-family:ui-monospace,Consolas,monospace}.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.toolbar input{width:min(330px,100%)}.empty{padding:20px;color:#6b8095;text-align:center}</style></head><body><header><div><strong>☁ CloudGate</strong> &nbsp; <span class="badge">AWS Provisioning • GitHub Pages Demo</span><br><small>Intake · Governance · IaC · Policy as Code · CI/CD</small></div><div class="flex"><span style="font-size:12px">Acting role</span><select aria-label="Demo role" class="role" id="role" onchange="loadPage()"><option value="BUSINESS_USER">Business User</option><option value="PRODUCT_OWNER">Product Owner</option><option value="TECH_OWNER">Tech Owner</option><option value="ENGINEER">Engineering</option><option value="RELEASE_MANAGER">Release Approver</option><option value="AUDITOR">Auditor</option><option value="EXECUTIVE">Executive</option></select></div></header><div class="layout"><nav><button id="nav-dashboard" class="active" onclick="show('dashboard')">◫ &nbsp; Executive Overview</button><button id="nav-intake" onclick="show('intake')">＋ &nbsp; New Intake</button><button id="nav-requests" onclick="show('requests')">▤ &nbsp; Request Pipeline</button><button id="nav-audit" onclick="show('audit')">▦ &nbsp; Audit Trail</button><button id="nav-infra" onclick="show('infra')">⌘ &nbsp; IaC & Policy Evidence</button></nav><main><div class="notice"><strong>Browser-only demonstration:</strong> all records are saved to this browser only. Role selector is simulated. No live AWS infrastructure, Java server, or shared database is connected.</div><div id="alert"></div><div id="page"></div></main></div>
